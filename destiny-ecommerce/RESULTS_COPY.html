METHOD: Customer pays → submits transaction ID → admin verifies → order confirmed

MTN MOBILE MONEY
  Number:  653526767

  Alt:     *126*46*4*1*12614654209793*AMOUNT#  (float account)

ORANGE MONEY
  Number:  640638536
  Name:    Cho Clinton Teneng
  USSD:    #150*1# then enter number
  App:     Orange Money app → Transfer

FLOW:
  1. Customer places order → POST /orders
  2. Customer pays via USSD or app
  3. Customer submits transaction ID → POST /payments/verify (creates pending payment)
  4. Admin reviews → PATCH /admin/payments/:id/approve or /reject
  5. System fires payment.verified event → order confirmed → notifications sent

ADMIN VERIFICATION ENDPOINTS:
  GET    /admin/payments?status=PENDING   — list pending verifications
  PATCH  /admin/payments/:id/approve      — approve and update order status
  PATCH  /admin/payments/:id/reject       — reject with reason

DEPLOYMENT GUIDE
================================================================================

STEP 1 — DATABASE (Neon — free 3GB)
  1. Create account at neon.tech
  2. Create project "destiny-ecommerce"
  3. Copy connection string to DATABASE_URL in Railway env vars
  4. Run migration: npx prisma migrate deploy

STEP 2 — API (Railway)
  1. Connect GitHub repo to Railway
  2. Set root directory: destiny-ecommerce/apps/api
  3. Add all env vars from .env.example
  4. Railway auto-detects Dockerfile
  5. Start command: sh -c "npx prisma migrate deploy && node dist/main"
  6. Note your Railway URL (e.g. https://destiny-api.railway.app)

STEP 3 — FRONTEND (Vercel)
  1. Import GitHub repo to Vercel
  2. Set root directory: destiny-ecommerce/apps/web
  3. Add env var: NEXT_PUBLIC_API_URL=https://destiny-api.railway.app
  4. Deploy

STEP 4 — DNS
  Point your domain to Vercel
  Add CORS_ORIGIN in Railway to match your domain

STEP 5 — SEED DATABASE (optional demo data)
  cd destiny-ecommerce/apps/api
  npx prisma db seed

STEP 6 — CREATE SUPER ADMIN
  POST https://your-api.railway.app/auth/register
  Body: { email, password, firstName, lastName, role: "SUPER_ADMIN" }
  (Change role directly in DB or via Prisma Studio after first registration)

DOCKER (local development)

DOCKER FILES
================================================================================

--- apps/api/Dockerfile ---
FROM node:20-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npx prisma generate
RUN npm run build

FROM node:20-alpine AS runner
RUN addgroup --system --gid 1001 nodejs
RUN adduser --system --uid 1001 nestjs
WORKDIR /app
COPY --from=builder --chown=nestjs:nodejs /app/node_modules ./node_modules
COPY --from=builder --chown=nestjs:nodejs /app/dist ./dist
COPY --from=builder --chown=nestjs:nodejs /app/prisma ./prisma
USER nestjs
EXPOSE 3001
CMD ["node", "dist/main"]

--- apps/web/Dockerfile ---
FROM node:20-alpine AS builder
WORKDIR /app
ARG NEXT_PUBLIC_API_URL
ENV NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM node:20-alpine AS runner
RUN addgroup --system --gid 1001 nodejs
RUN adduser --system --uid 1001 nextjs
WORKDIR /app
COPY --from=builder /app/public ./public
COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
USER nextjs
EXPOSE 3000
CMD ["node", "server.js"]

<script>
function copyAll(btn) {
  const text = document.getElementById('content').value;
  const original = btn.innerHTML;
  function success() {
    btn.classList.add('done');
    btn.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> COPIED!';
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = original; }, 3000);
  }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(success).catch(fallback);
  } else { fallback(); }
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); success();
  }
}
// Also allow clicking the textarea to select all
document.getElementById('content').addEventListener('click', function() {
  this.select();
});
</script>
