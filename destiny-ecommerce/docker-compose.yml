version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: destiny_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destiny_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-destiny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destiny_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destiny_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destiny_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: destiny_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-destiny_redis_pass} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destiny_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: destiny_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - destiny_network

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: destiny_api
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-destiny_user}:${POSTGRES_PASSWORD:-destiny_secure_password}@postgres:5432/${POSTGRES_DB:-destiny_ecommerce}
      REDIS_URL: redis://:${REDIS_PASSWORD:-destiny_redis_pass}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - destiny_network

  # Next.js Web App
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    container_name: destiny_web
    restart: unless-stopped
    env_file: ./apps/web/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://api:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - destiny_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: destiny_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api
    networks:
      - destiny_network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  destiny_network:
    driver: bridge
