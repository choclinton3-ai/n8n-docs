version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: destiny_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: destiny_db
      POSTGRES_USER: destiny_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destiny_user -d destiny_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: destiny_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: destiny_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://destiny_user:${DB_PASSWORD:-changeme_in_production}@postgres:5432/destiny_db
      REDIS_URL: redis://default:${REDIS_PASSWORD:-changeme_redis}@redis:6379
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node dist/main"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:5000/api/v1}
    container_name: destiny_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
